<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Terminal window -->
  <g transform="translate(60, 40)">
    <!-- Window frame -->
    <rect x="0" y="0" width="1080" height="420" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="1080" height="40" rx="12" fill="#1e293b"/>
    <rect x="0" y="30" width="1080" height="10" fill="#0f172a"/>
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="38" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="56" cy="20" r="6" fill="#22c55e"/>
    <text x="540" y="25" font-family="system-ui,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">eduverse — npm run dev  (Turbopack)</text>
    <!-- Terminal content -->
    <g transform="translate(24, 60)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#64748b">$ </text>
      <text x="18" y="0" fill="#e2e8f0">npm run dev</text>
      <!-- Line 2 -->
      <text x="0" y="24" fill="#22c55e">✓</text>
      <text x="18" y="24" fill="#94a3b8"> Starting EDUVERSE dev server...</text>
      <!-- Line 3 -->
      <text x="0" y="48" fill="#f97316">◜</text>
      <text x="18" y="48" fill="#94a3b8"> Turbopack compiled successfully in </text>
      <text x="370" y="48" fill="#f97316">1.24s</text>
      <!-- Line 4 -->
      <text x="0" y="72" fill="#3b82f6">ℹ</text>
      <text x="18" y="72" fill="#94a3b8">  Local: </text>
      <text x="80" y="72" fill="#3b82f6">http://localhost:4006</text>
      <!-- Line 5 -->
      <text x="0" y="96" fill="#3b82f6">ℹ</text>
      <text x="18" y="96" fill="#94a3b8">  Network: </text>
      <text x="90" y="96" fill="#3b82f6">http://192.168.1.100:4006</text>
      <!-- Empty line -->
      <text x="0" y="130" fill="#64748b">$ </text>
      <!-- Routes -->
      <text x="0" y="160" fill="#64748b">Routes (Next.js App Router):</text>
      <text x="0" y="186" fill="#22c55e">  ✓</text>
      <text x="24" y="186" fill="#e2e8f0">/ </text>
      <text x="40" y="186" fill="#64748b">— Student Dashboard (RSC)</text>
      <text x="0" y="210" fill="#22c55e">  ✓</text>
      <text x="24" y="210" fill="#e2e8f0">/courses </text>
      <text x="100" y="210" fill="#64748b">— Course Listing (RSC + ISR)</text>
      <text x="0" y="234" fill="#22c55e">  ✓</text>
      <text x="24" y="234" fill="#e2e8f0">/live </text>
      <text x="84" y="234" fill="#64748b">— Live Classes (WebRTC + LiveKit)</text>
      <text x="0" y="258" fill="#22c55e">  ✓</text>
      <text x="24" y="258" fill="#e2e8f0">/tutors </text>
      <text x="96" y="258" fill="#64748b">— Tutor Matching & Discovery</text>
      <text x="0" y="282" fill="#22c55e">  ✓</text>
      <text x="24" y="282" fill="#e2e8f0">/assignments </text>
      <text x="148" y="282" fill="#64748b">— Assignment Tracking & Submission</text>
      <text x="0" y="306" fill="#22c55e">  ✓</text>
      <text x="24" y="306" fill="#e2e8f0">/certificates </text>
      <text x="140" y="306" fill="#64748b">— Certification Engine</text>
      <!-- Compilation stats -->
      <text x="0" y="340" fill="#64748b">Compilation stats:</text>
      <text x="0" y="362" fill="#22c55e">  ✓</text>
      <text x="24" y="362" fill="#94a3b8">Modules: </text>
      <text x="96" y="362" fill="#f97316" font-weight="700">1,247</text>
      <text x="170" y="362" fill="#94a3b8">Size: </text>
      <text x="214" y="362" fill="#f97316" font-weight="700">2.4 MB</text>
      <text x="300" y="362" fill="#94a3b8">Errors: </text>
      <text x="356" y="362" fill="#22c55e" font-weight="700">0</text>
      <text x="400" y="362" fill="#94a3b8">Warnings: </text>
      <text x="478" y="362" fill="#f97316" font-weight="700">3</text>
      <text x="540" y="362" fill="#94a3b8">Ready in: </text>
      <text x="610" y="362" fill="#22c55e" font-weight="700">1.24s</text>

      <!-- Blinking cursor -->
      <rect x="18" y="380" width="10" height="16" fill="#f97316" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
