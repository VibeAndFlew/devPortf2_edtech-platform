<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="800" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="800" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="white" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="800" stroke="white" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="800" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="800" fill="#0f172a" opacity="0.95"/>
  <rect x="0" y="0" width="4" height="800" fill="url(#orange)"/>
  <!-- Logo -->
  <rect x="20" y="20" width="40" height="40" rx="10" fill="url(#orange)"/>
  <polygon points="48,32 34,40 48,48" fill="white" opacity="0.9"/>
  <polygon points="26,32 26,48 40,40" fill="white" opacity="0.6"/>
  <text x="72" y="47" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="white">EDUVERSE</text>
  <!-- Nav items -->
  <g font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8">
    <rect x="16" y="80" width="208" height="36" rx="8" fill="#f97316" opacity="0.15"/>
    <text x="48" y="103" fill="#fb923c" font-weight="600">📊 Dashboard</text>
    <text x="48" y="143">📚 Courses</text>
    <text x="48" y="183">🎥 Live Classes</text>
    <text x="48" y="223">👨‍🏫 Tutors</text>
    <text x="48" y="263">📝 Assignments</text>
    <text x="48" y="303">🏆 Certificates</text>
    <text x="48" y="343">💬 Messages</text>
    <text x="48" y="383">⚙️ Settings</text>
  </g>

  <!-- Main content area -->
  <!-- Top bar -->
  <rect x="240" y="0" width="960" height="56" fill="#1e293b" opacity="0.95"/>
  <text x="270" y="35" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">Dashboard</text>
  <text x="270" y="50" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Welcome back, Alex! You're on a 15-day streak 🔥</text>
  <!-- Search -->
  <rect x="750" y="14" width="200" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="770" y="33" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">🔍 Search courses...</text>
  <!-- Avatar -->
  <circle cx="1010" cy="28" r="16" fill="url(#orange)"/>
  <text x="1010" y="33" font-family="system-ui,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">A</text>

  <!-- Stats row -->
  <g transform="translate(270, 80)">
    <rect x="0" y="0" width="210" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Enrolled Courses</text>
    <text x="16" y="60" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#f97316">12</text>
    <text x="16" y="78" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e">↑ 2 this week</text>
  </g>
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="210" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Overall Progress</text>
    <text x="16" y="60" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#22c55e">78%</text>
    <text x="16" y="78" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e">↑ 5% this week</text>
  </g>
  <g transform="translate(730, 80)">
    <rect x="0" y="0" width="210" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Achievements</text>
    <text x="16" y="60" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#fbbf24">8</text>
    <text x="16" y="78" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">3 locked</text>
  </g>
  <g transform="translate(960, 80)">
    <rect x="0" y="0" width="210" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Study Streak</text>
    <text x="16" y="60" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#f97316">15🔥</text>
    <text x="16" y="78" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Best: 23 days</text>
  </g>

  <!-- Activity chart -->
  <g transform="translate(270, 190)">
    <rect x="0" y="0" width="540" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Weekly Activity</text>
    <!-- Chart area -->
    <rect x="20" y="40" width="500" height="200" rx="8" fill="#0f172a"/>
    <!-- Grid lines -->
    <line x1="40" y1="80" x2="540" y2="80" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="120" x2="540" y2="120" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="160" x2="540" y2="160" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="200" x2="540" y2="200" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="240" x2="540" y2="240" stroke="#334155" stroke-width="0.5"/>
    <!-- Area fill -->
    <polygon points="40,220 110,180 180,200 250,140 320,160 390,110 460,150 540,130 540,220 40,220" fill="#f97316" opacity="0.1"/>
    <!-- Line -->
    <polyline points="40,220 110,180 180,200 250,140 320,160 390,110 460,150 540,130" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <!-- Dots -->
    <circle cx="110" cy="180" r="4" fill="#f97316"/>
    <circle cx="250" cy="140" r="4" fill="#f97316"/>
    <circle cx="390" cy="110" r="5" fill="#f97316" filter="url(#glow)"/>
    <circle cx="540" cy="130" r="4" fill="#f97316"/>
    <!-- Labels -->
    <g font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
      <text x="40" y="265">Mon</text>
      <text x="110" y="265">Tue</text>
      <text x="180" y="265">Wed</text>
      <text x="250" y="265">Thu</text>
      <text x="320" y="265">Fri</text>
      <text x="390" y="265">Sat</text>
      <text x="460" y="265">Sun</text>
    </g>
  </g>

  <!-- Course progress -->
  <g transform="translate(830, 190)">
    <rect x="0" y="0" width="340" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Course Progress</text>
    <!-- Course 1 -->
    <rect x="20" y="46" width="300" height="8" rx="4" fill="#0f172a"/>
    <rect x="20" y="46" width="240" height="8" rx="4" fill="url(#orange)"/>
    <text x="20" y="70" font-family="system-ui,sans-serif" font-size="12" fill="#cbd5e1">Python Programming</text>
    <text x="320" y="70" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">80%</text>
    <!-- Course 2 -->
    <rect x="20" y="90" width="300" height="8" rx="4" fill="#0f172a"/>
    <rect x="20" y="90" width="165" height="8" rx="4" fill="#3b82f6"/>
    <text x="20" y="114" font-family="system-ui,sans-serif" font-size="12" fill="#cbd5e1">Mathematics 301</text>
    <text x="320" y="114" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">55%</text>
    <!-- Course 3 -->
    <rect x="20" y="134" width="300" height="8" rx="4" fill="#0f172a"/>
    <rect x="20" y="134" width="60" height="8" rx="4" fill="#22c55e"/>
    <text x="20" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#cbd5e1">SQL & Databases</text>
    <text x="320" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">20%</text>
    <!-- Course 4 -->
    <rect x="20" y="178" width="300" height="8" rx="4" fill="#0f172a"/>
    <rect x="20" y="178" width="100" height="8" rx="4" fill="#a855f7"/>
    <text x="20" y="202" font-family="system-ui,sans-serif" font-size="12" fill="#cbd5e1">Data Visualization</text>
    <text x="320" y="202" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">33%</text>
    <!-- View all button -->
    <rect x="20" y="230" width="300" height="32" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
    <text x="170" y="250" font-family="system-ui,sans-serif" font-size="12" fill="#f97316" text-anchor="middle" font-weight="600">View All Courses →</text>
  </g>

  <!-- Upcoming session -->
  <g transform="translate(270, 490)">
    <rect x="0" y="0" width="900" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Upcoming Sessions</text>
    <rect x="20" y="40" width="860" height="36" rx="8" fill="#0f172a"/>
    <text x="36" y="63" font-family="system-ui,sans-serif" font-size="13" fill="#e2e8f0">🎯 Math 301 — Live Review Session</text>
    <text x="720" y="63" font-family="system-ui,sans-serif" font-size="12" fill="#fb923c" font-weight="600">Today, 3:00 PM</text>
    <rect x="800" y="49" width="64" height="20" rx="6" fill="#f97316" opacity="0.2"/>
    <text x="832" y="63" font-family="system-ui,sans-serif" font-size="10" fill="#fb923c" text-anchor="middle" font-weight="600">Join →</text>
  </g>

  <!-- Bottom gradient -->
  <rect x="0" y="760" width="1200" height="40" fill="url(#bg)" opacity="0.6"/>
</svg>
