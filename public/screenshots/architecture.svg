<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="white" stroke-width="0.5"/>
  </g>

  <text x="40" y="50" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">🏗️ System Architecture</text>
  <text x="40" y="75" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Multi-layered architecture with Next.js monolith orchestration and specialized services</text>

  <!-- Client Layer -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="1120" height="90" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <rect x="0" y="0" width="30" height="90" rx="12" fill="url(#orange)"/>
    <text x="12" y="50" font-family="system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle" transform="rotate(-90,12,50)" font-weight="600">CLIENT</text>
    <text x="50" y="25" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fb923c">🌐 Client Layer</text>
    <!-- Boxes -->
    <rect x="50" y="38" width="200" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="150" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Next.js App (Port 4006)</text>
    <rect x="270" y="38" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="360" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Progressive Web App</text>
    <rect x="470" y="38" width="200" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="570" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">SSG + ISR Pages</text>
    <!-- Arrows down -->
    <line x1="150" y1="90" x2="150" y2="130" stroke="#f97316" stroke-width="1" marker-end="url(#arrowOrange)"/>
    <line x1="360" y1="90" x2="360" y2="130" stroke="#f97316" stroke-width="1"/>
    <line x1="570" y1="90" x2="570" y2="130" stroke="#f97316" stroke-width="1"/>
  </g>

  <!-- Edge Layer -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="1120" height="90" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="30" height="90" rx="12" fill="url(#blue)"/>
    <text x="12" y="50" font-family="system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle" transform="rotate(-90,12,50)" font-weight="600">EDGE</text>
    <text x="50" y="25" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#60a5fa">⚡ Vercel Edge Network</text>
    <rect x="50" y="38" width="200" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="150" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">CDN Cache (Vercel)</text>
    <rect x="270" y="38" width="200" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="370" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Image Optimization</text>
    <rect x="490" y="38" width="200" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="590" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Edge Functions</text>
    <line x1="150" y1="90" x2="150" y2="130" stroke="#3b82f6" stroke-width="1"/>
    <line x1="370" y1="90" x2="370" y2="130" stroke="#3b82f6" stroke-width="1"/>
    <line x1="590" y1="90" x2="590" y2="130" stroke="#3b82f6" stroke-width="1"/>
  </g>

  <!-- Application Layer -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="1120" height="90" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="0" y="0" width="30" height="90" rx="12" fill="url(#green)"/>
    <text x="12" y="50" font-family="system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle" transform="rotate(-90,12,50)" font-weight="600">APP</text>
    <text x="50" y="25" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#4ade80">⚡ Application Layer</text>
    <rect x="50" y="38" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="140" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">RSC + Streaming</text>
    <rect x="250" y="38" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="340" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">API Routes + tRPC</text>
    <rect x="450" y="38" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="540" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">WebSocket Gateway</text>
    <rect x="650" y="38" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="740" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Auth Service</text>
    <rect x="850" y="38" width="200" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="950" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Middleware (i18n, Rate)</text>
    <line x1="140" y1="90" x2="140" y2="130" stroke="#22c55e" stroke-width="1"/>
    <line x1="340" y1="90" x2="340" y2="130" stroke="#22c55e" stroke-width="1"/>
  </g>

  <!-- Services Layer -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="1120" height="120" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="30" height="120" rx="12" fill="url(#purple)"/>
    <text x="12" y="65" font-family="system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle" transform="rotate(-90,12,65)" font-weight="600">SERVICES</text>
    <text x="50" y="25" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#c084fc">🔌 Platform Services</text>
    <!-- Service boxes row 1 -->
    <rect x="50" y="38" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="117" y="58" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Course Engine</text>
    <rect x="200" y="38" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="267" y="58" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Live Class Service</text>
    <rect x="350" y="38" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="417" y="58" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Tutor Matching</text>
    <rect x="500" y="38" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="567" y="58" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Assignment Service</text>
    <rect x="650" y="38" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="717" y="58" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Certification</text>
    <!-- Row 2 -->
    <rect x="50" y="78" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="117" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Analytics Pipeline</text>
    <rect x="200" y="78" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="267" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Gamification</text>
    <rect x="350" y="78" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="417" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">AI Tutor Service</text>
    <rect x="500" y="78" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="567" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Notification Svc</text>
    <rect x="650" y="78" width="135" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="717" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Search Service</text>
  </g>

  <!-- Data Layer -->
  <g transform="translate(40, 560)">
    <rect x="0" y="0" width="540" height="90" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="30" height="90" rx="12" fill="#64748b"/>
    <text x="12" y="50" font-family="system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle" transform="rotate(-90,12,50)" font-weight="600">DATA</text>
    <text x="50" y="25" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🗄️ Data Layer</text>
    <rect x="50" y="38" width="140" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="120" y="61" font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">PostgreSQL</text>
    <rect x="205" y="38" width="140" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="275" y="61" font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Redis / Upstash</text>
    <rect x="360" y="38" width="140" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="430" y="61" font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Meilisearch</text>
  </g>

  <!-- External Layer -->
  <g transform="translate(620, 560)">
    <rect x="0" y="0" width="540" height="90" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="0" width="30" height="90" rx="12" fill="#475569"/>
    <text x="12" y="50" font-family="system-ui,sans-serif" font-size="10" fill="white" text-anchor="middle" transform="rotate(-90,12,50)" font-weight="600">EXT</text>
    <text x="50" y="25" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#64748b">🔗 External Integrations</text>
    <rect x="50" y="38" width="130" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="115" y="61" font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Stripe</text>
    <rect x="195" y="38" width="130" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="260" y="61" font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Resend</text>
    <rect x="340" y="38" width="130" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="405" y="61" font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">OpenAI / Claude</text>
    <rect x="390" y="38" width="0" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 690)">
    <rect x="0" y="0" width="1120" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <rect x="20" y="14" width="16" height="16" rx="4" fill="url(#orange)"/>
    <text x="44" y="26" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Client</text>
    <rect x="120" y="14" width="16" height="16" rx="4" fill="url(#blue)"/>
    <text x="144" y="26" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Edge</text>
    <rect x="210" y="14" width="16" height="16" rx="4" fill="url(#green)"/>
    <text x="234" y="26" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Application</text>
    <rect x="340" y="14" width="16" height="16" rx="4" fill="url(#purple)"/>
    <text x="364" y="26" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Services</text>
    <rect x="450" y="14" width="16" height="16" rx="4" fill="#64748b"/>
    <text x="474" y="26" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Data</text>
    <rect x="540" y="14" width="16" height="16" rx="4" fill="#475569"/>
    <text x="564" y="26" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">External</text>
    <text x="20" y="58" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Stack: Next.js 16 + React 19 | Tailwind v4 + shadcn/ui | PostgreSQL + Prisma | WebRTC + LiveKit | OpenAI + Claude</text>
  </g>
</svg>
