    <rect x="0" y="0" width="440" height="60" rx="12" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🎯 Math 301 — Live Review</text>
    <text x="16" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Today, 3:00 PM · Dr. Sarah Williams</text>
    <rect x="360" y="16" width="64" height="28" rx="8" fill="url(#orange)"/>
    <text x="392" y="35" font-family="system-ui,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Join</text>
  </g>

  <!-- Quick Actions -->
  <text x="80" y="560" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Quick Actions</text>
  <g transform="translate(80, 570)">
    <rect x="0" y="0" width="140" height="50" rx="10" fill="url(#orange)" opacity="0.15"/>
    <rect x="0" y="0" width="140" height="50" rx="10" fill="none" stroke="#f97316" stroke-width="0.5"/>
    <text x="70" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#fb923c" text-anchor="middle" font-weight="600">📚 Browse Courses</text>
