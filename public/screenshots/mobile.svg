    <text x="70" y="30" font-family="system-ui,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">💬 Messages</text>
  </g>

  <!-- Recent Activity -->
  <text x="80" y="660" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Recent Activity</text>
  <g transform="translate(80, 672)">
    <text x="0" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">✅ Completed "Python Functions" quiz</text>
    <text x="380" y="16" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="end">2h ago</text>
  </g>
  <g transform="translate(80, 698)">
    <text x="0" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">⭐ Achieved "Quick Learner" badge</text>
    <text x="380" y="16" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="end">5h ago</text>
  </g>
  <g transform="translate(80, 724)">
    <text x="0" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">📝 Submitted Physics assignment</text>
    <text x="380" y="16" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="end">1d ago</text>
  </g>

  <!-- Bottom nav -->
  <rect x="60" y="810" width="480" height="40" fill="#0f172a"/>
  <g font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="130" y="835" fill="#fb923c" font-weight="600">🏠 Home</text>
    <text x="240" y="835">📚 Courses</text>
    <text x="340" y="835">📊 Stats</text>
    <text x="450" y="835">👤 Profile</text>
  </g>
</svg>
