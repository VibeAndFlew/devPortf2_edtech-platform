    <rect x="0" y="0" width="6" height="80" rx="3" fill="url(#orange)"/>
    <text x="20" y="22" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Python Programming</text>
    <text x="20" y="40" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Variables & Data Types</text>
    <rect x="20" y="52" width="300" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="52" width="240" height="6" rx="3" fill="url(#orange)"/>
    <text x="420" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">80%</text>
    <text x="340" y="67" font-family="system-ui,sans-serif" font-size="11" fill="#f97316" font-weight="600">Continue →</text>
