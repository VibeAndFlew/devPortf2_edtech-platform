    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Skill Mastery</text>
    <!-- Radar chart polygon -->
    <polygon points="280,60 420,130 470,240 380,310 180,310 90,240 140,130" fill="#f97316" opacity="0.1" stroke="#f97316" stroke-width="1.5"/>
    <!-- Background grid -->
    <polygon points="280,60 420,130 470,240 380,310 180,310 90,240 140,130" fill="none" stroke="#334155" stroke-width="0.5"/>
    <polygon points="280,110 385,155 415,225 355,265 205,265 145,225 175,155" fill="none" stroke="#334155" stroke-width="0.5"/>
    <polygon points="280,160 350,180 360,210 330,220 230,220 200,210 210,180" fill="none" stroke="#334155" stroke-width="0.5"/>
    <polygon points="280,210 315,205 305,195 305,175 255,175 245,195 255,205" fill="none" stroke="#334155" stroke-width="0.5"/>
