    <g font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      <text x="280" y="50">Python</text>
      <text x="435" y="135">SQL</text>
      <text x="485" y="245">Statistics</text>
      <text x="380" y="325">ML</text>
      <text x="180" y="325">Data Viz</text>
      <text x="75" y="245">Math</text>
      <text x="125" y="135">Algorithms</text>
    </g>
  </g>

  <!-- Bottom: at-risk students -->
  <g transform="translate(40, 600)">
    <rect x="0" y="0" width="1120" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">At-Risk Students — Early Intervention</text>
