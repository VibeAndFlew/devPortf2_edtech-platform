<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="white" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="800" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="white" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="800" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="40" y="50" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">📊 Learning Analytics</text>
  <text x="40" y="75" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Comprehensive student performance and engagement insights</text>

  <!-- Period selector -->
  <rect x="920" y="30" width="80" height="32" rx="8" fill="#f97316" opacity="0.15"/>
  <text x="960" y="50" font-family="system-ui,sans-serif" font-size="12" fill="#fb923c" text-anchor="middle" font-weight="600">This Week</text>
  <rect x="1010" y="30" width="60" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1040" y="50" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Month</text>
  <rect x="1080" y="30" width="80" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1120" y="50" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Quarter</text>

  <!-- Overview stats -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="270" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Engagement Score</text>
    <text x="20" y="62" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#f97316">85%</text>
    <text x="20" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e">↑ 12% from last week</text>
  </g>
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="270" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Avg Session Length</text>
    <text x="20" y="62" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#3b82f6">42m</text>
    <text x="20" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e">↑ 5m from last week</text>
  </g>
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="270" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Completion Rate</text>
    <text x="20" y="62" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#22c55e">72%</text>
    <text x="20" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">↑ 8% from last month</text>
  </g>
  <g transform="translate(910, 100)">
    <rect x="0" y="0" width="250" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">At-Risk Students</text>
    <text x="20" y="62" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#ef4444">3</text>
    <text x="20" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#ef4444">Requires attention</text>
  </g>

  <!-- Main engagement chart -->
  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="540" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Engagement Over Time</text>
    <rect x="20" y="46" width="500" height="260" rx="8" fill="#0f172a"/>
    <!-- Grid -->
    <line x1="40" y1="76" x2="540" y2="76" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="116" x2="540" y2="116" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="156" x2="540" y2="156" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="196" x2="540" y2="196" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="236" x2="540" y2="236" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="276" x2="540" y2="276" stroke="#334155" stroke-width="0.5"/>
    <!-- Area fill -->
