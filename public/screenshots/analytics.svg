    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="340" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
      <circle cx="24" cy="28" r="18" fill="#ef4444" opacity="0.2"/>
      <text x="24" y="33" font-family="system-ui,sans-serif" font-size="14" fill="#ef4444" text-anchor="middle">⚠</text>
      <text x="56" y="24" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Sarah Johnson</text>
      <text x="56" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Math 301 — Engagement dropped 45%</text>
      <text x="56" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Last active: 7 days ago</text>
      <rect x="250" y="60" width="72" height="22" rx="6" fill="#ef4444" opacity="0.15"/>
      <text x="286" y="75" font-family="system-ui,sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="600">Notify →</text>
    </g>
    <g transform="translate(380, 44)">
      <rect x="0" y="0" width="340" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
      <circle cx="24" cy="28" r="18" fill="#fbbf24" opacity="0.2"/>
      <text x="24" y="33" font-family="system-ui,sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle">⚠</text>
      <text x="56" y="24" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Mike Chen</text>
      <text x="56" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Python — Missed 3 assignments</text>
      <text x="56" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Score dropped 30%</text>
      <rect x="250" y="60" width="72" height="22" rx="6" fill="#fbbf24" opacity="0.15"/>
      <text x="286" y="75" font-family="system-ui,sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="600">Notify →</text>
    </g>
    <g transform="translate(740, 44)">
      <rect x="0" y="0" width="340" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
      <circle cx="24" cy="28" r="18" fill="#f97316" opacity="0.2"/>
      <text x="24" y="33" font-family="system-ui,sans-serif" font-size="14" fill="#f97316" text-anchor="middle">⚠</text>
      <text x="56" y="24" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Emily Davis</text>
      <text x="56" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">SQL — Quiz scores declining</text>
      <text x="56" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Avg score: 62% (↓ 18%)</text>
      <rect x="250" y="60" width="72" height="22" rx="6" fill="#f97316" opacity="0.15"/>
      <text x="286" y="75" font-family="system-ui,sans-serif" font-size="10" fill="#f97316" text-anchor="middle" font-weight="600">Notify →</text>
    </g>
