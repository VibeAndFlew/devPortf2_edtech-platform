      <polyline points="40,296 70,260 100,270 130,220 160,240 190,190 220,210 250,160 280,180 310,140 340,150 370,120 400,135 430,100 460,115 490,90 520,105 540,85 540,296 40,296" fill="#f97316" opacity="0.08"/>
    </g>
    <g font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
      <text x="40" y="315">Jan</text>
      <text x="100" y="315">Feb</text>
      <text x="160" y="315">Mar</text>
      <text x="220" y="315">Apr</text>
      <text x="280" y="315">May</text>
      <text x="340" y="315">Jun</text>
      <text x="400" y="315">Jul</text>
      <text x="460" y="315">Aug</text>
      <text x="520" y="315">Sep</text>
    </g>
  </g>

  <!-- Skill mastery radar -->
  <g transform="translate(600, 230)">
