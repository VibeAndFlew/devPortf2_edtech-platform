<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="40" y="50" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">🔍 Observability Dashboard</text>
  <text x="40" y="75" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Real-time monitoring of platform health, performance, and user activity</text>

  <!-- Status row -->
  <g transform="translate(40, 100)">
    <circle cx="16" cy="16" r="6" fill="#22c55e"/>
    <circle cx="16" cy="16" r="6" fill="#22c55e" opacity="0.4">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="21" font-family="system-ui,sans-serif" font-size="13" fill="#22c55e" font-weight="600">All Systems Operational</text>
    <text x="900" y="21" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Last updated: 2 minutes ago</text>
  </g>

  <!-- 4 metric cards -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="270" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Response Time (p95)</text>
    <text x="20" y="62" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#22c55e">42ms</text>
    <text x="20" y="85" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e">↓ 8ms from last hour</text>
    <text x="210" y="62" font-family="system-ui,sans-serif" font-size="28" fill="#22c55e">✓</text>
  </g>
  <g transform="translate(330, 140)">
    <rect x="0" y="0" width="270" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Error Rate</text>
    <text x="20" y="62" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#f97316">0.12%</text>
    <text x="20" y="85" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e">Within threshold (&lt;0.5%)</text>
    <text x="210" y="62" font-family="system-ui,sans-serif" font-size="28" fill="#f97316">⚠</text>
  </g>
  <g transform="translate(620, 140)">
    <rect x="0" y="0" width="270" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Active Users</text>
    <text x="20" y="62" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#3b82f6">2,847</text>
    <text x="20" y="85" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e">↑ 12% from yesterday</text>
    <text x="210" y="62" font-family="system-ui,sans-serif" font-size="28" fill="#3b82f6">📈</text>
  </g>
  <g transform="translate(910, 140)">
    <rect x="0" y="0" width="250" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Uptime (30d)</text>
    <text x="20" y="62" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#22c55e">99.97%</text>
    <text x="20" y="85" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e">99.9% target met</text>
    <text x="210" y="62" font-family="system-ui,sans-serif" font-size="28" fill="#22c55e">✓</text>
  </g>

  <!-- Main chart - API Response Times -->
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="580" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">API Response Times (Last 24h)</text>
    <rect x="20" y="46" width="540" height="200" rx="8" fill="#0f172a"/>
    <!-- Grid -->
    <line x1="40" y1="76" x2="560" y2="76" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="116" x2="560" y2="116" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="156" x2="560" y2="156" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="196" x2="560" y2="196" stroke="#334155" stroke-width="0.5"/>
    <line x1="40" y1="236" x2="560" y2="236" stroke="#334155" stroke-width="0.5"/>
    <!-- P95 line -->
    <polyline points="40,130 80,125 120,135 160,120 200,140 240,115 280,145 320,110 360,125 400,130 440,120 480,135 520,110 560,125" fill="none" stroke="#f97316" stroke-width="2"/>
    <!-- P50 line -->
    <polyline points="40,180 80,175 120,185 160,170 200,190 240,165 280,195 320,160 360,175 400,185 440,170 480,190 520,165 560,175" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Legend -->
    <rect x="400" y="52" width="12" height="3" rx="1.5" fill="#f97316"/>
    <text x="416" y="56" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">p95</text>
    <rect x="450" y="52" width="12" height="3" rx="1.5" fill="#3b82f6"/>
    <text x="466" y="56" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">p50</text>
    <!-- X labels -->
    <g font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
      <text x="40" y="260">00:00</text>
      <text x="130" y="260">04:00</text>
      <text x="220" y="260">08:00</text>
      <text x="310" y="260">12:00</text>
      <text x="400" y="260">16:00</text>
      <text x="490" y="260">20:00</text>
    </g>
  </g>

  <!-- Services status -->
  <g transform="translate(640, 280)">
    <rect x="0" y="0" width="520" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Service Health</text>
    <!-- Service rows -->
    <g transform="translate(20, 46)" font-family="system-ui,sans-serif">
      <rect x="0" y="0" width="460" height="32" rx="6" fill="#0f172a">
        <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="14" cy="16" r="4" fill="#22c55e"/>
      <text x="28" y="21" font-size="12" fill="#e2e8f0">Web Application</text>
      <text x="400" y="21" font-size="11" fill="#22c55e" text-anchor="end">Operational</text>
      <text x="430" y="21" font-size="10" fill="#64748b" text-anchor="end">42ms</text>
    </g>
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="460" height="32" rx="6" fill="#0f172a"/>
      <circle cx="14" cy="16" r="4" fill="#22c55e"/>
      <text x="28" y="21" font-size="12" fill="#e2e8f0">PostgreSQL Database</text>
      <text x="400" y="21" font-size="11" fill="#22c55e" text-anchor="end">Operational</text>
      <text x="430" y="21" font-size="10" fill="#64748b" text-anchor="end">12ms</text>
    </g>
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="460" height="32" rx="6" fill="#0f172a"/>
      <circle cx="14" cy="16" r="4" fill="#22c55e"/>
      <text x="28" y="21" font-size="12" fill="#e2e8f0">LiveKit Media Server</text>
      <text x="400" y="21" font-size="11" fill="#22c55e" text-anchor="end">Operational</text>
      <text x="430" y="21" font-size="10" fill="#64748b" text-anchor="end">85ms</text>
    </g>
    <g transform="translate(20, 172)">
      <rect x="0" y="0" width="460" height="32" rx="6" fill="#0f172a"/>
      <circle cx="14" cy="16" r="4" fill="#f97316"/>
      <text x="28" y="21" font-size="12" fill="#e2e8f0">AI Tutor Service</text>
      <text x="400" y="21" font-size="11" fill="#f97316" text-anchor="end">Degraded</text>
      <text x="430" y="21" font-size="10" fill="#64748b" text-anchor="end">2.4s</text>
    </g>
    <g transform="translate(20, 214)">
      <rect x="0" y="0" width="460" height="32" rx="6" fill="#0f172a"/>
      <circle cx="14" cy="16" r="4" fill="#22c55e"/>
      <text x="28" y="21" font-size="12" fill="#e2e8f0">Redis Cache</text>
      <text x="400" y="21" font-size="11" fill="#22c55e" text-anchor="end">Operational</text>
      <text x="430" y="21" font-size="10" fill="#64748b" text-anchor="end">1ms</text>
    </g>
  </g>

  <!-- Bottom: Recent errors -->
  <g transform="translate(40, 590)">
    <rect x="0" y="0" width="1120" height="170" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Recent Errors (Last 24h)</text>
    <g transform="translate(20, 44)" font-family="system-ui,sans-serif">
      <rect x="0" y="0" width="1060" height="32" rx="6" fill="#0f172a"/>
      <rect x="0" y="0" width="4" height="32" rx="2" fill="#ef4444"/>
      <text x="16" y="21" font-size="12" fill="#e2e8f0">POST /api/ai/tutor/recommend — OpenAI API timeout</text>
      <text x="880" y="21" font-size="11" fill="#64748b">2 min ago</text>
      <rect x="970" y="8" width="72" height="20" rx="6" fill="#ef4444" opacity="0.15"/>
      <text x="1006" y="22" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="600">Investigating</text>
    </g>
    <g transform="translate(20, 84)">
      <rect x="0" y="0" width="1060" height="32" rx="6" fill="#0f172a"/>
      <rect x="0" y="0" width="4" height="32" rx="2" fill="#fbbf24"/>
      <text x="16" y="21" font-size="12" fill="#e2e8f0">GET /courses/python-101 — Slow query (2.4s)</text>
      <text x="880" y="21" font-size="11" fill="#64748b">15 min ago</text>
      <rect x="970" y="8" width="72" height="20" rx="6" fill="#fbbf24" opacity="0.15"/>
      <text x="1006" y="22" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="600">Monitoring</text>
    </g>
    <g transform="translate(20, 124)">
      <rect x="0" y="0" width="1060" height="32" rx="6" fill="#0f172a"/>
      <rect x="0" y="0" width="4" height="32" rx="2" fill="#fbbf24"/>
      <text x="16" y="21" font-size="12" fill="#e2e8f0">WebSocket disconnect — LiveKit room expiring</text>
      <text x="880" y="21" font-size="11" fill="#64748b">1h ago</text>
      <rect x="970" y="8" width="72" height="20" rx="6" fill="#fbbf24" opacity="0.15"/>
      <text x="1006" y="22" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="600">Monitoring</text>
    </g>
  </g>
</svg>
